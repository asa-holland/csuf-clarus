version: "3.8"

services:
  document-extractor:
    build:
      context: ./src
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - ./uploads:/app/uploads
      - ./corpus_files:/app/corpus_files
      - ./corpus_files_preprocessed:/app/corpus_files_preprocessed
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=1
    restart: unless-stopped
