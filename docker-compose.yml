version: "3.8"

services:
  document-extractor:
    build:
      context: ./src
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - ./uploads:/app/uploads
      - ./corpus_files:/app/corpus_files
      - ./corpus_files_preprocessed:/app/corpus_files_preprocessed
      - ./tests:/app/tests
      - ./pytest.ini:/app/pytest.ini
      - ./src/clarus:/app/clarus
      - ./src/app.py:/app/app.py
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=1
      - FLASK_RUN_HOST=0.0.0.0
      - FLASK_RUN_PORT=5000
    restart: unless-stopped
    command: python -m flask run --host=0.0.0.0 --port=5000 --reload
